name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Même ligne de Node qu'en local et qu'en production : .nvmrc fait foi, pas un
      # numéro recopié ici. Il ne nomme que la majeure : `check-latest` prend le dernier
      # correctif publié plutôt que celui en cache sur le runner, qui peut être sous le
      # plancher d'`engines.node` — et `engine-strict` ferait alors échouer `npm ci`.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test
